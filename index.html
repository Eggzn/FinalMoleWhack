<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whack-a-Mole</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>

  <h1>Whack!</h1>
  <div>
    <div>
      <h2>Click start to play!</h2>
    </div>
    <div>
      <h2>score: <span id="score">0</span></h2>
    </div>
    <div>
      <h2><span id="timer">0</span> seconds left.</h2>
    </div>

    <audio id="background-music" src="assets/molesong.mp3" loop></audio> <!--made for to be selectable.-->
  
    <div class="cursor">
      <img src="assets/mallet.png">
    </div>
  
  </div>

  <div class="grid">
    <div id="hole0" class="hole">
      <div id="mole0" class="mole"></div>
    </div>
    <div id="hole1" class="hole">
      <div id="mole1" class="mole"></div>
    </div>
    <div id="hole2" class="hole">
      <div id="mole2" class="mole"></div>
    </div>
    <div id="hole3" class="hole">
      <div id="mole3" class="mole"></div>
    </div>
    <div id="hole4" class="hole">
      <div id="mole4" class="mole"></div>
    </div>
    <div id="hole5" class="hole">
      <div id="mole5" class="mole"></div>
    </div>
    <div id="hole6" class="hole">
      <div id="mole6" class="mole"></div>
    </div>
    <div id="hole7" class="hole">
      <div id="mole7" class="mole"></div>
    </div>
    <div id="hole8" class="hole">
      <div id="mole8" class="mole"></div>
    </div>
   
  </div>

  
  
    
 
  <div class="button-container">
    
    <div>
      <label for="difficulty">Select Difficulty:</label>
        <select id="difficulty">
         <option value="easy">Easy</option>
         <option value="normal">Normal</option>
         <option value="hard">Hard</option>
      </select>  
    </div>
    
     <button id="start">Start Game</button> <!-- Start button -->
    <!--<button id ="startButton" type="button" class="startButton" onclick="startGame('easy')"> Easy</button> 
    <button id ="normalButton" type="button" class="startButton" onclick="startGame('normal')">Normal</button>
    <button id="hardButton" type="button" class="startButton" onclick="startGame('hard')">Hard</button> -->
  </div>
  
  
  <script src="./src/index.js"></script>
</body>
</html>
